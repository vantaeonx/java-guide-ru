name: Проверка учебных материалов
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Проверить каркасы и примеры
        run: python3 tools/verify.py
      - name: Проверить Maven-конфигурацию
        run: mvn -B compile
